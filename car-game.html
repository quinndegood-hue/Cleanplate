const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------ math utils ------------------------------ */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
function angLerp(a,b,t){ let d=((b-a+Math.PI)%TAU)-Math.PI; if(d<-Math.PI)d+=TAU; return a+d*t; }
function angDiff(a,b){ let d=((b-a+Math.PI)%TAU)-Math.PI; if(d<-Math.PI)d+=TAU; return d; }

/* ------------------------------ input ----------------------------------- */
const keys = {};
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key===' ') keys['space']=true;
});
window.addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false;
  if(e.key===' ') keys['space']=false;
});

/* =========================================================================
   TRACKS — each track is a smooth closed loop defined by control points.
   ========================================================================= */
function catmullRom(points, samplesPer=18){
  // returns a dense list of {x,y} sampled along a closed Catmull-Rom spline
  const out=[];
  const n=points.length;
  for(let i=0;i<n;i++){
    const p0=points[(i-1+n)%n], p1=points[i], p2=points[(i+1)%n], p3=points[(i+2)%n];
    for(let s=0;s<samplesPer;s++){
      const t=s/samplesPer, t2=t*t, t3=t2*t;
      out.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
      });
    }
  }
  return out;
}

const THEME = {
  day:  {grass:'#3a7d3a', grass2:'#357535', road:'#3a3f4b', road2:'#343945',
         sky:'#7fb8e6', rumble:'#e8e8e8', rumble2:'#d24b4b', line:'#f4d03f'},
  dusk: {grass:'#4a5d3a', grass2:'#445634', road:'#3d3a44', road2:'#37343e',
         sky:'#b56a4a', rumble:'#f0e0d0', rumble2:'#c0504b', line:'#f0c040'},
  night:{grass:'#1c2a1c', grass2:'#1a271a', road:'#2b2f38', road2:'#262a33',
         sky:'#0a1020', rumble:'#c8c8d0', rumble2:'#a03d48', line:'#e0c840'},
  dawn: {grass:'#4a6b4e', grass2:'#446348', road:'#454049', road2:'#3f3a43',
         sky:'#e0a070', rumble:'#f4ead8', rumble2:'#c85a5a', line:'#ffd060'},
  storm:{grass:'#33403a', grass2:'#2f3b35', road:'#33343c', road2:'#2e2f36',
         sky:'#3a4152', rumble:'#d8d8dc', rumble2:'#b04848', line:'#d8d060'},
};

class Track {
  constructor(def){
    this.def = def;
    this.width = def.width;
    this.theme = THEME[def.theme];
    this.center = catmullRom(def.pts, 20);
    this.n = this.center.length;
    this._buildFrames();
    this._buildCheckpoints();
    this.length = this._perimeter();
    this._buildFeatures();
  }
  _buildFeatures(){
    // deterministic-ish scatter so a track looks the same each visit this session
    const t=this;
    // Boost pads: a handful placed on the racing line at spaced indices
    this.boostPads=[];
    const padCount=4;
    for(let k=0;k<padCount;k++){
      const idx=Math.floor((k+0.5)/padCount*this.n);
      const c=this.center[idx], nr=this.nrm[idx];
      const off=rand(-1,1)*this.width*0.2;
      this.boostPads.push({x:c.x+nr.x*off, y:c.y+nr.y*off,
        angle:Math.atan2(this.tan[idx].y,this.tan[idx].x), cool:0, idx});
    }
    // Oil slicks: placed near a corner apex, on the road
    this.oilSlicks=[];
    const oilCount=this.def.theme==='night'?4:3;
    for(let k=0;k<oilCount;k++){
      const idx=Math.floor(rand(0,this.n));
      const c=this.center[idx], nr=this.nrm[idx];
      const off=rand(-1,1)*this.width*0.3;
      this.oilSlicks.push({x:c.x+nr.x*off, y:c.y+nr.y*off, r:rand(26,40)});
    }
    // Cones: lined up near an edge to nudge the racing line
    this.cones=[];
    for(let k=0;k<10;k++){
      const idx=Math.floor(rand(0,this.n));
      const c=this.center[idx], nr=this.nrm[idx];
      const side=Math.random()<0.5?1:-1;
      const off=side*this.width*(0.34+Math.random()*0.1);
      this.cones.push(this._newCone(c.x+nr.x*off, c.y+nr.y*off));
    }
    // Scenery: trees & rocks scattered off the road
    this.scenery=[];
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    for(const c of this.center){minx=Math.min(minx,c.x);miny=Math.min(miny,c.y);maxx=Math.max(maxx,c.x);maxy=Math.max(maxy,c.y);}
    minx-=260;miny-=260;maxx+=260;maxy+=260;
    let tries=0;
    while(this.scenery.length<90 && tries<1400){
      tries++;
      const x=rand(minx,maxx), y=rand(miny,maxy);
      const {dist}=this.nearestIndex(x,y);
      if(dist < this.width*0.5+34) continue; // keep off the tarmac & rumble
      const type=Math.random()<0.78?'tree':'rock';
      this.scenery.push({x,y,type,r:type==='tree'?rand(12,22):rand(7,13),tint:Math.random()});
    }
  }
  _newCone(x,y){ return {x,y,ox:x,oy:y,vx:0,vy:0,hit:0}; }
  resetFeatures(){
    for(const p of this.boostPads) p.cool=0;
    for(const c of this.cones){ c.x=c.ox; c.y=c.oy; c.vx=0; c.vy=0; c.hit=0; }
  }
  _buildFrames(){
    // per-sample tangent & normal for road edges
    this.tan=[]; this.nrm=[];
    for(let i=0;i<this.n;i++){
      const a=this.center[(i-1+this.n)%this.n], b=this.center[(i+1)%this.n];
      let tx=b.x-a.x, ty=b.y-a.y; const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
      this.tan.push({x:tx,y:ty});
      this.nrm.push({x:-ty,y:tx});
    }
  }
  _perimeter(){
    let L=0; for(let i=0;i<this.n;i++){const a=this.center[i],b=this.center[(i+1)%this.n]; L+=Math.hypot(b.x-a.x,b.y-a.y);} return L;
  }
  _buildCheckpoints(){
    this.checkpoints=[];
    const count=24;
    for(let c=0;c<count;c++){
      const idx=Math.floor(c/count*this.n);
      this.checkpoints.push(idx);
    }
    this.startIdx=0;
    const s=this.center[0], t=this.tan[0];
    this.startPos={x:s.x, y:s.y};
    this.startAngle=Math.atan2(t.y,t.x);
  }
  // nearest sample index to a world point (linear scan is fine for our sizes)
  nearestIndex(x,y){
    let best=0,bd=Infinity;
    for(let i=0;i<this.n;i++){
      const d=(this.center[i].x-x)**2+(this.center[i].y-y)**2;
      if(d<bd){bd=d;best=i;}
    }
    return {index:best, dist:Math.sqrt(bd)};
  }
  onRoad(x,y){
    const {dist}=this.nearestIndex(x,y);
    return dist < this.width*0.5 + 6;
  }
}

/* =========================================================================
   PARTICLES
   ========================================================================= */
class Particles {
  constructor(){ this.list=[]; }
  spawn(x,y,vx,vy,life,size,color,fade=1,grow=0){
    this.list.push({x,y,vx,vy,life,max:life,size,color,fade,grow});
  }
  smoke(x,y,vx,vy){
    this.spawn(x,y,vx+rand(-8,8),vy+rand(-8,8),rand(0.4,0.9),rand(6,11),'smoke',1,26);
  }
  spark(x,y,ang){
    const sp=rand(60,180);
    this.spawn(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,rand(0.15,0.35),rand(1,2.5),'spark');
  }
  dust(x,y){
    this.spawn(x+rand(-6,6),y+rand(-6,6),rand(-14,14),rand(-14,14),rand(0.3,0.6),rand(3,6),'dust',1,18);
  }
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i];
      p.life-=dt;
      if(p.life<=0){ this.list.splice(i,1); continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vx*=0.94; p.vy*=0.94;
      p.size+=p.grow*dt;
    }
  }
  draw(ctx,cam){
    for(const p of this.list){
      const a=clamp(p.life/p.max,0,1);
      const sx=p.x-cam.x, sy=p.y-cam.y;
      if(p.color==='smoke'){
        ctx.fillStyle=`rgba(180,180,190,${a*0.34})`;
      }else if(p.color==='dust'){
        ctx.fillStyle=`rgba(150,130,90,${a*0.4})`;
      }else{ // spark
        ctx.fillStyle=`rgba(255,${180+Math.floor(a*60)},80,${a})`;
      }
      ctx.beginPath(); ctx.arc(sx,sy,p.size,0,TAU); ctx.fill();
    }
  }
}

/* =========================================================================
   SKID MARKS — persistent trails drawn to an offscreen world layer
   ========================================================================= */
class Skidmarks {
  constructor(){ this.marks=[]; this.max=1400; }
  add(x,y,alpha){
    this.marks.push({x,y,a:alpha});
    if(this.marks.length>this.max) this.marks.shift();
  }
  draw(ctx,cam){
    ctx.lineCap='round';
    for(const m of this.marks){
      ctx.fillStyle=`rgba(20,18,22,${m.a*0.5})`;
      ctx.beginPath(); ctx.arc(m.x-cam.x,m.y-cam.y,3.1,0,TAU); ctx.fill();
    }
  }
  clear(){ this.marks.length=0; }
}

/* =========================================================================
   CAR
   ========================================================================= */
class Car {
  constructor(x,y,angle,color,isPlayer=false){
    this.x=x; this.y=y; this.angle=angle;
    this.vx=0; this.vy=0;         // world velocity
    this.color=color;
    this.isPlayer=isPlayer;
    this.w=34; this.h=18;
    this.steer=0;                 // -1..1
    this.throttle=0; this.brake=0; this.handbrake=false;
    this.wheelBase=26;
    this.driftAmt=0;
    this.engineSpin=0;
    this.boost=0;                 // seconds of boost remaining
    // race state
    this.lap=0; this.nextCP=0; this.progress=0; this.finished=false;
    this.lapTimes=[]; this.lapStart=0;
    this.place=1;
    // AI
    this.aiT=0; this.aiTargetIdx=0;
  }
  get speed(){ return Math.hypot(this.vx,this.vy); }

  applyPhysics(dt, track){
    // Convert world velocity into car-local (forward/lateral)
    const cos=Math.cos(this.angle), sin=Math.sin(this.angle);
    let fwd = this.vx*cos + this.vy*sin;
    let lat = -this.vx*sin + this.vy*cos;

    const onRoad = track.onRoad(this.x,this.y);
    let gripBase = onRoad?1:0.55;
    if(track.def.theme==='storm') gripBase*=0.86;  // wet tarmac
    if(this.onOil) gripBase*=0.32;   // oil slick: sudden loss of grip

    // Engine force
    const pm = this.powerMul||1;
    const maxSpeed = 430 * (this.boost>0?1.5:1) * (0.97+0.03*pm);
    const enginePower = 720 * (this.boost>0?1.9:1) * pm;
    const reversePower = 300;
    let drive=0;
    if(this.throttle>0){
      drive = enginePower * this.throttle * (1 - clamp(fwd/maxSpeed,0,1));
    }
    if(this.brake>0){
      if(fwd>4) drive -= 900*this.brake;         // braking
      else drive -= reversePower*this.brake;      // reverse
    }
    fwd += drive*dt;

    // Rolling resistance + drag
    fwd *= (1 - (onRoad?0.9:2.4)*dt);
    fwd -= Math.sign(fwd)*Math.min(Math.abs(fwd), 6*dt);

    // Lateral grip (the drift model): handbrake or high slip reduces grip
    let latGrip = gripBase * (this.handbrake?0.34:1.0);
    // more grip at low speed, less when pushed
    latGrip *= clamp(1.3 - Math.abs(lat)/260, 0.28, 1.3);
    const latFriction = clamp(latGrip* 9 * dt,0,1);
    const latBefore=lat;
    lat *= (1-latFriction);

    this.driftAmt = clamp(Math.abs(latBefore)/180,0,1);

    // Recompose world velocity
    this.vx = fwd*cos - lat*sin;
    this.vy = fwd*sin + lat*cos;

    // Steering — speed-sensitive, reverses when going backward
    const speed=Math.hypot(this.vx,this.vy);
    const steerAuthority = 2.6 * clamp(speed/120,0,1);
    const dir = fwd<0?-1:1;
    const turn = this.steer * steerAuthority * dir;
    // extra rotation while drifting for control
    this.angle += (turn + (this.handbrake? this.steer*0.9*clamp(speed/200,0,1):0)) * dt;

    // Integrate position
    this.x += this.vx*dt;
    this.y += this.vy*dt;

    // engine sound driver
    this.engineSpin = lerp(this.engineSpin, clamp(Math.abs(fwd)/maxSpeed,0.05,1) + this.throttle*0.15, 0.2);

    if(this.boost>0) this.boost-=dt;
  }

  corners(){
    const c=Math.cos(this.angle), s=Math.sin(this.angle);
    const hw=this.w/2, hh=this.h/2;
    const pts=[[hw,hh],[hw,-hh],[-hw,-hh],[-hw,hh]];
    return pts.map(([px,py])=>({x:this.x+px*c-py*s, y:this.y+px*s+py*c}));
  }

  draw(ctx,cam,t){
    const sx=this.x-cam.x, sy=this.y-cam.y;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(this.angle);
    const w=this.w, h=this.h;

    // shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';
    roundRect(ctx,-w/2+3,-h/2+4,w,h,5); ctx.fill();

    // body
    const grad=ctx.createLinearGradient(0,-h/2,0,h/2);
    grad.addColorStop(0, shade(this.color,1.25));
    grad.addColorStop(0.5, this.color);
    grad.addColorStop(1, shade(this.color,0.7));
    ctx.fillStyle=grad;
    roundRect(ctx,-w/2,-h/2,w,h,5); ctx.fill();

    // cockpit / windshield
    ctx.fillStyle='rgba(20,28,40,0.85)';
    roundRect(ctx,-w*0.05,-h*0.34,w*0.28,h*0.68,3); ctx.fill();
    // hood stripe
    ctx.fillStyle='rgba(255,255,255,0.16)';
    ctx.fillRect(-w/2+3,-2,w-6,4);
    // wheels
    ctx.fillStyle='#15161a';
    const ww=7, wh=4;
    for(const [dx,dy] of [[w*0.3,-h/2],[w*0.3,h/2-wh],[-w*0.36,-h/2],[-w*0.36,h/2-wh]]){
      ctx.fillRect(dx-ww/2, dy, ww, wh);
    }
    // headlights
    ctx.fillStyle='rgba(255,240,180,0.9)';
    ctx.fillRect(w/2-2,-h/2+2,2,3); ctx.fillRect(w/2-2,h/2-5,2,3);
    // brake lights
    if(this.brake>0){ ctx.fillStyle='rgba(255,60,60,0.95)'; ctx.fillRect(-w/2,-h/2+2,2,3); ctx.fillRect(-w/2,h/2-5,2,3); }

    // boost flame
    if(this.boost>0){
      const fl=8+Math.sin(t*40)*4;
      ctx.fillStyle='rgba(90,200,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(-w/2,-3); ctx.lineTo(-w/2-fl,0); ctx.lineTo(-w/2,3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function shade(hex,f){
  const c=hex.replace('#',''); let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  r=clamp(Math.round(r*f),0,255); g=clamp(Math.round(g*f),0,255); b=clamp(Math.round(b*f),0,255);
  return `rgb(${r},${g},${b})`;
}

/* =========================================================================
   AUDIO — synthesized engine + effects via WebAudio
   ========================================================================= */
class Audio {
  constructor(){ this.ctx=null; this.enabled=true; this.started=false; }
  init(){
    if(this.started) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=0.25; this.master.connect(this.ctx.destination);
      // engine
      this.osc=this.ctx.createOscillator(); this.osc.type='sawtooth';
      this.oscGain=this.ctx.createGain(); this.oscGain.gain.value=0.0;
      this.filter=this.ctx.createBiquadFilter(); this.filter.type='lowpass'; this.filter.frequency.value=800;
      this.osc.connect(this.filter); this.filter.connect(this.oscGain); this.oscGain.connect(this.master);
      this.osc.frequency.value=60; this.osc.start();
      this.started=true;
    }catch(e){ this.enabled=false; }
  }
  engine(spin, drifting){
    if(!this.started||!this.enabled) return;
    const f=60+spin*260;
    this.osc.frequency.setTargetAtTime(f,this.ctx.currentTime,0.05);
    this.oscGain.gain.setTargetAtTime(0.12+spin*0.14,this.ctx.currentTime,0.08);
    this.filter.frequency.setTargetAtTime(500+spin*2600,this.ctx.currentTime,0.05);
  }
  blip(freq,dur,type='square',vol=0.3){
    if(!this.started||!this.enabled) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(this.master); o.start();
    g.gain.setValueAtTime(vol,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
    o.stop(this.ctx.currentTime+dur);
  }
  mute(m){ if(this.master) this.master.gain.value=m?0:0.25; this.enabled=!m; }
}
const audio=new Audio();

/* =========================================================================
   GAME
   ========================================================================= */
const STATE={MENU:0,COUNTDOWN:1,RACE:2,PAUSE:3,RESULTS:4};
const CAR_COLORS=['#ff5d6c','#39d0ff','#5ef08a','#ffcf3f','#c77dff','#ff9f40'];

class Game {
  constructor(){
    this.state=STATE.MENU;
    this.cars=[];
    this.trackIdx=0;
    this.totalLaps=3;
    this.aiCount=3;
    this.cam={x:0,y:0,zoom:1,shake:0};
    this.particles=new Particles();
    this.skids=new Skidmarks();
    this.time=0;
    this.best=this._loadBest();
    this.menuSel=0;
    this.muted=false;
    this.showTouch = (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window) || navigator.maxTouchPoints>0;
    this.touch={left:false,right:false,gas:false,brake:false,hbrake:false,nitro:false};
    this._pointers={}; // pointerId -> button id
    this._uiButtons=[]; // rebuilt each frame for clickable menu/pause/results UI
    this._bindMenu();
    this._bindTouch();
    this.setupTrack();
  }
  _touchButtons(){
    // circular on-screen controls (screen space)
    const r=Math.max(34, Math.min(VW,VH)*0.075);
    const by=VH-r-24;
    return [
      {id:'left',  x:r+24,        y:by, r, label:'◀'},
      {id:'right', x:r*3+44,      y:by, r, label:'▶'},
      {id:'brake', x:VW-r*3-44,   y:by, r, label:'▼', color:'#ff5d6c'},
      {id:'gas',   x:VW-r-24,     y:by, r:r*1.15, label:'▲', color:'#5ef08a'},
      {id:'hbrake',x:VW/2-r*1.15, y:VH-r-24, r:r*0.85, label:'✋', color:'#ffcf3f'},
      {id:'nitro', x:VW/2+r*1.15, y:VH-r-24, r:r*0.85, label:'🔥', color:'#39d0ff'},
    ];
  }
  _pauseBtn(){ return {x:VW/2, y:34, r:20}; }
  _hitButton(px,py){
    for(const b of this._touchButtons()){
      if((px-b.x)**2+(py-b.y)**2 <= (b.r*1.15)**2) return b.id;
    }
    return null;
  }
  _bindTouch(){
    const toXY=e=>{ const rect=canvas.getBoundingClientRect(); return [e.clientX-rect.left, e.clientY-rect.top]; };
    const inPause=(x,y)=>{ const p=this._pauseBtn(); return (x-p.x)**2+(y-p.y)**2<=p.r*p.r; };
    const down=e=>{
      audio.init();
      const [x,y]=toXY(e);
      // on-screen UI buttons (menus, results, pause) — mouse + touch
      for(const b of this._uiButtons){
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ audio.blip(360,0.05); b.action(); return; }
      }
      if(this.showTouch){
        if((this.state===STATE.RACE||this.state===STATE.COUNTDOWN) && inPause(x,y)){ this.state=STATE.PAUSE; return; }
        const b=this._hitButton(x,y);
        if(b){ this._pointers[e.pointerId]=b; this.touch[b]=true; this._recompute(); }
      }
    };
    const up=e=>{
      const b=this._pointers[e.pointerId];
      if(b){ delete this._pointers[e.pointerId]; this._recompute(); }
    };
    const move=e=>{
      if(!(e.pointerId in this._pointers)) return;
      const [x,y]=toXY(e);
      const b=this._hitButton(x,y);
      const old=this._pointers[e.pointerId];
      if(b!==old){ if(b){ this._pointers[e.pointerId]=b; } else { delete this._pointers[e.pointerId]; } this._recompute(); }
    };
    canvas.addEventListener('pointerdown',down);
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('pointerleave',up);
    canvas.addEventListener('pointermove',move);
  }
  _recompute(){
    // rebuild touch flags from active pointers
    const t={left:false,right:false,gas:false,brake:false,hbrake:false,nitro:false};
    for(const id in this._pointers){ t[this._pointers[id]]=true; }
    this.touch=t;
  }
  _loadBest(){
    try{ return JSON.parse(localStorage.getItem('apexdrift_best')||'{}'); }catch(e){ return {}; }
  }
  _saveBest(){
    try{ localStorage.setItem('apexdrift_best',JSON.stringify(this.best)); }catch(e){}
  }
  setupTrack(){
    this.track=new Track(TRACKS[this.trackIdx]);
  }
  startRace(){
    audio.init();
    this.setupTrack();
    this.skids.clear();
    this.particles.list.length=0;
    const t=this.track;
    this.cars=[];
    const n=this.aiCount+1;
    // grid positions staggered behind start
    for(let i=0;i<n;i++){
      const row=Math.floor(i/2), col=i%2;
      const backIdx=(t.startIdx - row*3 + t.n)%t.n;
      const c=t.center[backIdx], nr=t.nrm[backIdx];
      const off=(col===0?-1:1)*t.width*0.22;
      const car=new Car(c.x+nr.x*off, c.y+nr.y*off, t.startAngle, CAR_COLORS[i%CAR_COLORS.length], i===0);
      car.nextCP=0; car.aiTargetIdx=t.startIdx;
      if(i>0){ car.aiSkill=rand(0.82,0.99); car.aiThrottleNoise=rand(0.9,1); }
      this.cars.push(car);
    }
    this.player=this.cars[0];
    this.cam.x=this.player.x; this.cam.y=this.player.y;
    this.countdown=3.999;
    this.lapPopup=null;
    this.state=STATE.COUNTDOWN;
    this.raceTime=0;
    this.finishOrder=[];
    audio.blip(440,0.15);
  }
  _bindMenu(){
    window.addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if(this.state===STATE.MENU){
        if(k==='arrowup'||k==='w'){ this.menuSel=(this.menuSel+2)%3; audio.init(); audio.blip(300,0.05); }
        else if(k==='arrowdown'||k==='s'){ this.menuSel=(this.menuSel+1)%3; audio.init(); audio.blip(300,0.05); }
        else if(k==='arrowleft'||k==='arrowright'){
          if(this.menuSel===0){ this.trackIdx=(this.trackIdx+(k==='arrowleft'?TRACKS.length-1:1))%TRACKS.length; this.setupTrack(); }
          else if(this.menuSel===1){ this.totalLaps=clamp(this.totalLaps+(k==='arrowleft'?-1:1),1,9); }
          else if(this.menuSel===2){ this.aiCount=clamp(this.aiCount+(k==='arrowleft'?-1:1),0,5); }
          audio.init(); audio.blip(360,0.05);
        }
        else if(k==='enter'||k===' '){ this.startRace(); }
        else if(k==='m'){ this.toggleMute(); }
      } else if(this.state===STATE.RACE||this.state===STATE.COUNTDOWN){
        if(k==='escape'||k==='p'){ this.state=STATE.PAUSE; }
        if(k==='m'){ this.toggleMute(); }
        if(k==='r'){ this.startRace(); }
      } else if(this.state===STATE.PAUSE){
        if(k==='escape'||k==='p'){ this.state=STATE.RACE; }
        if(k==='r'){ this.startRace(); }
        if(k==='q'){ this.state=STATE.MENU; }
        if(k==='m'){ this.toggleMute(); }
      } else if(this.state===STATE.RESULTS){
        if(k==='enter'||k===' '){ this.state=STATE.MENU; }
        if(k==='r'){ this.startRace(); }
      }
    });
  }
  toggleMute(){ this.muted=!this.muted; audio.mute(this.muted); }

  /* --------------------------- update ---------------------------------- */
  update(dt){
    this.time+=dt;
    if(this.state===STATE.COUNTDOWN){
      this.countdown-=dt;
      if(Math.ceil(this.countdown)!==Math.ceil(this.countdown+dt)){
        const c=Math.ceil(this.countdown);
        if(c>0) audio.blip(440,0.15); else audio.blip(880,0.3);
      }
      if(this.countdown<=0){ this.state=STATE.RACE; for(const c of this.cars) c.lapStart=0; }
      this.updateCarsFrozen(dt);
      this.updateWeather(dt);
      this.updateCamera(dt);
      return;
    }
    if(this.state!==STATE.RACE) return;
    this.raceTime+=dt;

    // player controls
    const p=this.player;
    if(!p.finished){
      const tc=this.touch;
      p.throttle = (keys['arrowup']||keys['w']||tc.gas)?1:0;
      p.brake = (keys['arrowdown']||keys['s']||tc.brake)?1:0;
      let st=0; if(keys['arrowleft']||keys['a']||tc.left)st-=1; if(keys['arrowright']||keys['d']||tc.right)st+=1;
      p.steer=lerp(p.steer,st,0.35);
      p.handbrake=!!keys['space']||tc.hbrake;
      p.wantNitro=!!keys['shift']||tc.nitro;
    } else { p.throttle=0; p.brake=0.4; p.steer=0; p.handbrake=false; p.wantNitro=false; }

    // AI
    for(let i=1;i<this.cars.length;i++) this.updateAI(this.cars[i],dt);

    // terrain flags (oil) must be set before physics reads them
    for(const c of this.cars) this.applyTerrain(c);
    // physics + effects
    for(const c of this.cars){
      c.applyPhysics(dt,this.track);
      this.trackCarProgress(c);
      this.spawnCarEffects(c,dt);
    }
    this.resolveCollisions();
    this.updateCones(dt);
    this.checkObstacles(dt);

    this.updateDriftScore(dt);
    this.updateNitro(dt);
    this.updateWeather(dt);
    this.updateWrongWay(dt);
    if(this.lapPopup){ this.lapPopup.timer-=dt; if(this.lapPopup.timer<=0) this.lapPopup=null; }
    this.particles.update(dt);
    this.updateCamera(dt);
    this.updatePlaces();

    // engine audio from player
    audio.engine(this.player.engineSpin, this.player.driftAmt>0.5);

    // race finished?
    if(this.finishOrder.length===this.cars.length){
      this.state=STATE.RESULTS;
      this.saveResult();
    }
  }
  updateCarsFrozen(dt){
    for(const c of this.cars){ c.vx*=0.9; c.vy*=0.9; }
  }

  updateAI(car,dt){
    const t=this.track;
    // look ahead along the racing line, scaled by speed
    const lookAhead = 9 + Math.floor(car.speed/26);
    let tgtIdx=(car.aiTargetIdx+lookAhead)%t.n;
    const tgt=t.center[tgtIdx];
    // estimate upcoming corner sharpness by comparing tangents ahead
    const tA=t.tan[car.aiTargetIdx%t.n], tB=t.tan[tgtIdx];
    const curve=Math.abs(angDiff(Math.atan2(tA.y,tA.x),Math.atan2(tB.y,tB.x)));
    // apex-seeking: bias target toward inside of the corner
    const cross=tA.x*tB.y-tA.y*tB.x;
    const nr=t.nrm[tgtIdx];
    const bias=clamp(curve*1.4,0,1)*t.width*0.32*(cross>0?-1:1);
    const aim={x:tgt.x+nr.x*bias, y:tgt.y+nr.y*bias};
    const desired=Math.atan2(aim.y-car.y, aim.x-car.x);
    let d=angDiff(car.angle,desired);
    car.steer=clamp(d*1.7,-1,1);
    // throttle: ease off for sharp turns; skill & noise vary drivers
    const sharp=Math.abs(d)+curve*0.6;
    let thr=1 - clamp((sharp-0.22)*1.35,0,0.72);
    thr*=car.aiSkill*(0.9+0.1*Math.sin(this.time*1.3+car.x*0.01));
    car.throttle=clamp(thr,0,1);
    car.brake= sharp>0.85 && car.speed>210 ?0.65:0;
    car.handbrake= sharp>1.05 && car.speed>240;
    // grab boost when available if roughly aligned
    // rubber-banding: fall back if far ahead of player, push if behind
    const diff=this.player.progress - car.progress;   // >0 => AI trails
    car.powerMul=clamp(1 + diff*0.0011, 0.9, 1.16);
    // advance target as it gets close
    const near=t.center[(car.aiTargetIdx+1)%t.n];
    if(Math.hypot(near.x-car.x,near.y-car.y)<t.width*0.62){
      car.aiTargetIdx=(car.aiTargetIdx+1)%t.n;
    }
  }

  trackCarProgress(car){
    if(car.finished) return;
    const t=this.track;
    const {index}=t.nearestIndex(car.x,car.y);
    // checkpoint gating: must pass checkpoints in order to count a lap
    const cpIdx=t.checkpoints[car.nextCP];
    // distance around: how close index is to expected checkpoint
    if(nearIndex(index,cpIdx,t.n,t.n/t.checkpoints.length*0.9)){
      car.nextCP++;
      if(car.nextCP>=t.checkpoints.length){
        car.nextCP=0;
        car.lap++;
        if(car.isPlayer) audio.blip(660,0.12);
        const lt=this.raceTime - car.lapStart;
        car.lapStart=this.raceTime;
        if(car.lap>0) car.lapTimes.push(lt);
        if(car.isPlayer && car.lap>0 && car.lap<=this.totalLaps){
          // lap delta vs best-so-far (stored best on race start, then live bests)
          if(car.bestLapSoFar===undefined){ const rec=this.best[t.def.name]; car.bestLapSoFar=(rec&&rec.lap)?rec.lap:Infinity; }
          const delta = lt - car.bestLapSoFar;
          this.lapPopup={ lap:car.lap, delta: isFinite(car.bestLapSoFar)?delta:null, timer:2.6 };
          if(lt<car.bestLapSoFar){ car.bestLapSoFar=lt; audio.blip(880,0.14,'square',0.2); }
        }
        if(car.lap>this.totalLaps){
          car.finished=true;
          this.finishOrder.push(car);
          car.finishTime=this.raceTime;
          if(car.isPlayer){ audio.blip(880,0.4); this.cam.shake=8; }
        }
      }
    }
    // continuous progress for placing
    car.progress=car.lap*t.n + index;
  }

  spawnCarEffects(car,dt){
    const drifting=car.driftAmt>0.45 || (car.handbrake && car.speed>60);
    const c=Math.cos(car.angle), s=Math.sin(car.angle);
    // rear wheel positions
    const rx=car.x - c*car.w*0.36, ry=car.y - s*car.w*0.36;
    const off=car.h*0.5;
    const wheels=[
      {x:rx - (-s)*off, y:ry - (c)*off},
      {x:rx + (-s)*off, y:ry + (c)*off},
    ];
    if(drifting && car.speed>50){
      for(const w of wheels){
        this.skids.add(w.x,w.y,clamp(car.driftAmt,0.2,1));
        if(Math.random()<0.6) this.particles.smoke(w.x,w.y,-c*20,-s*20);
        if(Math.random()<0.25) this.particles.spark(w.x,w.y,car.angle+Math.PI+rand(-0.5,0.5));
      }
    }
    // off-road dust
    if(!this.track.onRoad(car.x,car.y) && car.speed>60){
      for(const w of wheels) if(Math.random()<0.5) this.particles.dust(w.x,w.y);
    }
  }

  resolveCollisions(){
    // simple circle-based car-car collision
    for(let i=0;i<this.cars.length;i++){
      for(let j=i+1;j<this.cars.length;j++){
        const a=this.cars[i], b=this.cars[j];
        const dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy); const min=26;
        if(d<min && d>0.001){
          const nx=dx/d, ny=dy/d; const overlap=(min-d);
          a.x-=nx*overlap*0.5; a.y-=ny*overlap*0.5;
          b.x+=nx*overlap*0.5; b.y+=ny*overlap*0.5;
          // exchange some velocity along normal
          const avn=a.vx*nx+a.vy*ny, bvn=b.vx*nx+b.vy*ny;
          const imp=(bvn-avn);
          a.vx+=nx*imp*0.5; a.vy+=ny*imp*0.5;
          b.vx-=nx*imp*0.5; b.vy-=ny*imp*0.5;
          if((a.isPlayer||b.isPlayer) && Math.abs(imp)>120){ audio.blip(120,0.1,'sawtooth',0.2); this.cam.shake=Math.min(6,Math.abs(imp)/60); }
        }
      }
    }
  }
  applyTerrain(car){
    car.onOil=false;
    for(const o of this.track.oilSlicks){
      if((car.x-o.x)**2+(car.y-o.y)**2 < o.r*o.r){ car.onOil=true; break; }
    }
  }
  updateCones(dt){
    for(const c of this.track.cones){
      if(c.hit>0){
        c.x+=c.vx*dt; c.y+=c.vy*dt;
        c.vx*=0.9; c.vy*=0.9; c.hit-=dt;
      }
    }
  }
  checkObstacles(dt){
    // boost pads
    for(const car of this.cars){
      for(const p of this.track.boostPads){
        if(p.cool>0){ p.cool-=dt; continue; }
        if((car.x-p.x)**2+(car.y-p.y)**2 < 30*30){
          car.boost=Math.max(car.boost,1.8);
          if(car.isPlayer) car.nitro=clamp((car.nitro||0)+0.3,0,1);
          p.cool=1.2;
          if(car.isPlayer){ audio.blip(720,0.12,'square',0.28); audio.blip(1080,0.14,'square',0.2); }
          for(let i=0;i<6;i++) this.particles.spark(car.x,car.y,rand(0,TAU));
        }
      }
      // cones — knock them and lose a little speed
      for(const c of this.track.cones){
        const dx=c.x-car.x, dy=c.y-car.y;
        if(dx*dx+dy*dy < 20*20){
          const d=Math.hypot(dx,dy)||1;
          c.vx=dx/d*Math.max(140,car.speed*0.7); c.vy=dy/d*Math.max(140,car.speed*0.7);
          c.hit=1.2;
          car.vx*=0.9; car.vy*=0.9;
          if(car.isPlayer){ audio.blip(200,0.08,'triangle',0.2); this.cam.shake=Math.min(4,this.cam.shake+2); }
          this.particles.dust(c.x,c.y);
        }
      }
    }
  }

  updateDriftScore(dt){
    const p=this.player;
    if(p.driftScore===undefined){ p.driftScore=0; p.chain=0; p.mult=1; p.driftIdle=99; p.chainFade=0; p.bestChain=0; p.lastBank=0; }
    const drifting = p.driftAmt>0.5 && p.speed>90 && this.track.onRoad(p.x,p.y) && !p.finished;
    if(drifting){
      p.chain += p.speed*p.driftAmt*dt*0.28*p.mult;
      p.driftIdle=0;
      p.mult=clamp(p.mult+dt*0.55,1,6);
      p.chainFade=1;
    } else {
      p.driftIdle+=dt;
      if(p.driftIdle>0.4 && p.chain>0){
        const banked=Math.round(p.chain);
        p.driftScore+=banked; p.lastBank=banked;
        p.bestChain=Math.max(p.bestChain,banked);
        if(banked>400){ audio.blip(520,0.08,'square',0.18); audio.blip(780,0.1,'square',0.14); }
        p.chain=0; p.mult=1; p.bankFlash=0.9;
      }
      p.chainFade=Math.max(0,p.chainFade-dt*1.4);
      if(p.bankFlash>0) p.bankFlash-=dt;
    }
  }

  updateNitro(dt){
    const p=this.player;
    if(p.nitro===undefined) p.nitro=0;
    // fill from drifting
    if(p.driftAmt>0.5 && p.speed>90 && this.track.onRoad(p.x,p.y)){
      p.nitro=clamp(p.nitro + dt*0.16*clamp(p.driftAmt,0,1.4), 0, 1);
    }
    // deploy
    if(p.wantNitro && p.nitro>0.02 && !p.finished){
      p.nitro=Math.max(0,p.nitro - dt*0.42);
      p.boost=Math.max(p.boost,0.12);   // keep boost visuals/physics active
      if(!p.nitroSfx){ audio.blip(300,0.12,'sawtooth',0.2); p.nitroSfx=true; }
    } else { p.nitroSfx=false; }
  }

  updateWeather(dt){
    const storm=this.track.def.theme==='storm';
    if(!storm){ this.rain=null; this.flash=0; return; }
    if(!this.rain){
      this.rain=[];
      for(let i=0;i<220;i++) this.rain.push({x:rand(0,VW),y:rand(0,VH),l:rand(10,20),s:rand(700,1100)});
      this.lightTimer=rand(2,6);
    }
    for(const d of this.rain){
      d.y+=d.s*dt; d.x-=d.s*0.28*dt;
      if(d.y>VH){ d.y=-10; d.x=rand(0,VW+200); }
      if(d.x<-20){ d.x+=VW+40; }
    }
    this.lightTimer-=dt;
    if(this.lightTimer<=0){ this.flash=1; this.lightTimer=rand(3,9); audio.blip(60,0.5,'sawtooth',0.12); }
    if(this.flash>0) this.flash=Math.max(0,this.flash-dt*2.2);
  }
  drawWeather(){
    if(!this.rain) return;
    if(this.flash>0){ ctx.fillStyle=`rgba(220,230,255,${this.flash*0.35})`; ctx.fillRect(0,0,VW,VH); }
    ctx.strokeStyle='rgba(180,200,230,0.35)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    for(const d of this.rain){ ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.l*0.28,d.y+d.l); }
    ctx.stroke();
  }

  updateWrongWay(dt){
    const p=this.player;
    if(p.wrongTimer===undefined) p.wrongTimer=0;
    if(p.speed>60 && !p.finished){
      const {index}=this.track.nearestIndex(p.x,p.y);
      const tan=this.track.tan[index];
      const dot=(p.vx*tan.x+p.vy*tan.y)/(p.speed||1);
      if(dot<-0.4) p.wrongTimer=Math.min(1.5,p.wrongTimer+dt);
      else p.wrongTimer=Math.max(0,p.wrongTimer-dt*2);
    } else p.wrongTimer=Math.max(0,p.wrongTimer-dt*2);
  }

  updateCamera(dt){
    const p=this.player;
    // lead the camera slightly in the direction of travel
    const lead=0.35;
    const tx=p.x+p.vx*lead, ty=p.y+p.vy*lead;
    this.cam.x=lerp(this.cam.x,tx,1-Math.pow(0.001,dt));
    this.cam.y=lerp(this.cam.y,ty,1-Math.pow(0.001,dt));
    // zoom out at speed
    const targetZoom=clamp(1.15 - p.speed/1600,0.72,1.15);
    this.cam.zoom=lerp(this.cam.zoom,targetZoom,1-Math.pow(0.01,dt));
    if(this.cam.shake>0) this.cam.shake=Math.max(0,this.cam.shake-dt*20);
  }

  updatePlaces(){
    const sorted=[...this.cars].sort((a,b)=>{
      if(a.finished&&b.finished) return a.finishTime-b.finishTime;
      if(a.finished) return -1; if(b.finished) return 1;
      return b.progress-a.progress;
    });
    sorted.forEach((c,i)=>c.place=i+1);
  }

  saveResult(){
    const key=this.track.def.name;
    const bestLap=Math.min(...this.player.lapTimes.filter(x=>x>0));
    const rec=this.best[key]||{};
    let changed=false;
    if(isFinite(bestLap) && (!rec.lap || bestLap<rec.lap)){ rec.lap=bestLap; changed=true; }
    const ds=(this.player.driftScore||0)+Math.round(this.player.chain||0);
    if(ds>(rec.drift||0)){ rec.drift=ds; changed=true; }
    if(changed){ this.best[key]=rec; this._saveBest(); }
  }

  /* --------------------------- render ---------------------------------- */
  render(){
    ctx.save();
    // apply camera transform (zoom around screen center + shake)
    const shx=this.cam.shake?rand(-this.cam.shake,this.cam.shake):0;
    const shy=this.cam.shake?rand(-this.cam.shake,this.cam.shake):0;
    ctx.translate(VW/2+shx, VH/2+shy);
    ctx.scale(this.cam.zoom,this.cam.zoom);
    // camera top-left in world space, used by draw fns which subtract cam.x/y
    const camWorld={x:this.cam.x, y:this.cam.y};
    ctx.translate(-VW/2,-VH/2);
    // Now draw with world->screen where screen = world - (cam - VW/2)
    const cam={x:this.cam.x-VW/2, y:this.cam.y-VH/2};

    if(this.state!==STATE.MENU) this.drawWorld(cam);
    ctx.restore();

    // atmospheric vignette (screen space)
    if(this.state!==STATE.MENU){
      const dark=this.track.def.theme==='night'?0.6:0.28;
      const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.35,VW/2,VH/2,Math.max(VW,VH)*0.72);
      vg.addColorStop(0,'rgba(0,0,0,0)');
      vg.addColorStop(1,`rgba(0,0,0,${dark})`);
      ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
      this.drawWeather();
    }

    // HUD (screen space, not affected by camera)
    this.drawHUD();
  }

  drawWorld(cam){
    const t=this.track, th=t.theme;
    // background grass
    ctx.fillStyle=th.grass;
    ctx.fillRect(0,0,VW,VH);
    // subtle grass texture stripes
    ctx.fillStyle=th.grass2;
    const gs=64;
    const ox=-((cam.x)%gs+gs)%gs, oy=-((cam.y)%gs+gs)%gs;
    for(let y=oy;y<VH;y+=gs) for(let x=ox+((Math.floor((y-oy)/gs)%2)*gs);x<VW;x+=gs*2){
      ctx.fillRect(x,y,gs,gs);
    }

    this.drawTrack(cam);
    this.drawOil(cam);
    this.skids.draw(ctx,cam);
    this.drawBoostPads(cam);
    this.drawStartLine(cam);
    this.drawCones(cam);

    // draw cars sorted so player is on top
    const order=[...this.cars].sort((a,b)=>(a.isPlayer?1:0)-(b.isPlayer?1:0));
    for(const c of order) c.draw(ctx,cam,this.time);

    this.particles.draw(ctx,cam);
    this.drawScenery(cam);
    if(this.track.def.theme==='night') this.drawNightLights(cam);
  }

  drawTrack(cam){
    const t=this.track, th=t.theme;
    const n=t.n, W=t.width/2;
    // road fill: draw as a thick closed strip (two offset polylines)
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const idx=i%n; const c=t.center[idx], nr=t.nrm[idx];
      const x=c.x+nr.x*W-cam.x, y=c.y+nr.y*W-cam.y;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    for(let i=n;i>=0;i--){
      const idx=i%n; const c=t.center[idx], nr=t.nrm[idx];
      const x=c.x-nr.x*W-cam.x, y=c.y-nr.y*W-cam.y;
      ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=th.road; ctx.fill();

    // rumble strips on edges
    for(const side of [1,-1]){
      for(let i=0;i<n;i++){
        const c=t.center[i], nr=t.nrm[i];
        const ex=c.x+nr.x*W*side, ey=c.y+nr.y*W*side;
        ctx.fillStyle=(i%2===0)?th.rumble:th.rumble2;
        const tan=t.tan[i];
        ctx.save();
        ctx.translate(ex-cam.x,ey-cam.y);
        ctx.rotate(Math.atan2(tan.y,tan.x));
        ctx.fillRect(-6,-4*side,12,4);
        ctx.restore();
      }
    }
    // center dashed line
    ctx.strokeStyle=th.line; ctx.lineWidth=3; ctx.setLineDash([16,20]); ctx.lineDashOffset=0;
    ctx.beginPath();
    for(let i=0;i<=n;i++){ const c=t.center[i%n]; const x=c.x-cam.x,y=c.y-cam.y; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke(); ctx.setLineDash([]);
  }

  drawStartLine(cam){
    const t=this.track;
    const c=t.center[t.startIdx], nr=t.nrm[t.startIdx], tan=t.tan[t.startIdx];
    ctx.save();
    ctx.translate(c.x-cam.x,c.y-cam.y);
    ctx.rotate(Math.atan2(tan.y,tan.x));
    const W=t.width, rows=2, cols=10, cw=W/cols, ch=7;
    for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
      ctx.fillStyle=((r+col)%2===0)?'#f5f5f5':'#181818';
      ctx.fillRect(-2 + r*ch - rows*ch/2, -W/2+col*cw, ch, cw);
    }
    ctx.restore();
  }

  drawOil(cam){
    for(const o of this.track.oilSlicks){
      const x=o.x-cam.x, y=o.y-cam.y;
      const g=ctx.createRadialGradient(x,y,2,x,y,o.r);
      g.addColorStop(0,'rgba(12,10,18,0.85)');
      g.addColorStop(0.7,'rgba(20,16,30,0.6)');
      g.addColorStop(1,'rgba(20,16,30,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,o.r,0,TAU); ctx.fill();
      // oily sheen
      ctx.fillStyle='rgba(90,120,150,0.18)';
      ctx.beginPath(); ctx.arc(x-o.r*0.2,y-o.r*0.2,o.r*0.4,0,TAU); ctx.fill();
    }
  }
  drawBoostPads(cam){
    for(const p of this.track.boostPads){
      ctx.save();
      ctx.translate(p.x-cam.x,p.y-cam.y);
      ctx.rotate(p.angle);
      const active=p.cool<=0;
      const pulse=0.5+0.5*Math.sin(this.time*8);
      for(let k=0;k<3;k++){
        const a=active?(0.35+pulse*0.55*(1-k*0.25)):0.12;
        ctx.fillStyle=`rgba(57,208,255,${a})`;
        ctx.beginPath();
        const bx=(k-1)*11;
        ctx.moveTo(bx-8,-15); ctx.lineTo(bx+6,0); ctx.lineTo(bx-8,15);
        ctx.lineTo(bx-2,0); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
  drawCones(cam){
    for(const c of this.track.cones){
      const x=c.x-cam.x, y=c.y-cam.y;
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(x+2,y+3,7,4,0,0,TAU); ctx.fill();
      // cone body
      ctx.fillStyle='#ff7a1a';
      ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+6,y+5); ctx.lineTo(x-6,y+5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x-4,y-2,8,3);
      if(c.hit>0){ // tumble tint
        ctx.fillStyle='rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+6,y+5); ctx.lineTo(x-6,y+5); ctx.closePath(); ctx.fill();
      }
    }
  }
  drawScenery(cam){
    for(const s of this.track.scenery){
      const x=s.x-cam.x, y=s.y-cam.y;
      if(x<-40||x>VW+40||y<-40||y>VH+40) continue; // cull
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.beginPath(); ctx.ellipse(x+s.r*0.4,y+s.r*0.5,s.r*0.9,s.r*0.5,0,0,TAU); ctx.fill();
      if(s.type==='tree'){
        ctx.fillStyle='#5a3d24';
        ctx.fillRect(x-2,y-1,4,6);
        const green=lerp(70,120,s.tint);
        ctx.fillStyle=`rgb(${Math.round(40+s.tint*30)},${Math.round(green)},${Math.round(40+s.tint*20)})`;
        ctx.beginPath(); ctx.arc(x,y-2,s.r,0,TAU); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.arc(x-s.r*0.3,y-s.r*0.4,s.r*0.5,0,TAU); ctx.fill();
      }else{
        const g=Math.round(110+s.tint*40);
        ctx.fillStyle=`rgb(${g},${g},${g+6})`;
        ctx.beginPath(); ctx.arc(x,y,s.r,0,TAU); ctx.fill();
        ctx.fillStyle='rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.arc(x+s.r*0.3,y+s.r*0.3,s.r*0.5,0,TAU); ctx.fill();
      }
    }
  }
  drawNightLights(cam){
    // headlight cones + vignette for night atmosphere
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(const c of this.cars){
      const x=c.x-cam.x, y=c.y-cam.y;
      const dirx=Math.cos(c.angle), diry=Math.sin(c.angle);
      const len=120, spread=42;
      const tipx=x+dirx*len, tipy=y+diry*len;
      const g=ctx.createRadialGradient(x,y,4,x,y,len);
      g.addColorStop(0,'rgba(255,240,190,0.28)');
      g.addColorStop(1,'rgba(255,240,190,0)');
      ctx.fillStyle=g;
      const px=-diry, py=dirx;
      ctx.beginPath();
      ctx.moveTo(x+px*6,y+py*6);
      ctx.lineTo(tipx+px*spread,tipy+py*spread);
      ctx.lineTo(tipx-px*spread,tipy-py*spread);
      ctx.lineTo(x-px*6,y-py*6);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  uiButton(x,y,w,h,label,action,opts={}){
    this._uiButtons.push({x,y,w,h,action});
    ctx.fillStyle=opts.fill||'rgba(255,255,255,0.07)';
    roundRect(ctx,x,y,w,h,9); ctx.fill();
    ctx.strokeStyle=opts.stroke||'rgba(255,255,255,0.28)'; ctx.lineWidth=2; roundRect(ctx,x,y,w,h,9); ctx.stroke();
    ctx.fillStyle=opts.color||'#e8eef7'; ctx.font=opts.font||'bold 20px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,x+w/2,y+h/2+1);
    ctx.textAlign='left'; ctx.textBaseline='top';
  }

  drawHUD(){
    this._uiButtons=[];
    if(this.state===STATE.MENU){ this.drawMenu(); return; }
    const p=this.player;
    // top-left: lap + place + time
    ctx.textAlign='left'; ctx.textBaseline='top';
    panel(10,10,168,86);
    ctx.fillStyle='#e8eef7'; ctx.font='bold 22px system-ui';
    ctx.fillText(`LAP ${Math.min(p.lap+ (p.finished?0:1),this.totalLaps)}/${this.totalLaps}`,22,20);
    ctx.font='bold 30px system-ui'; ctx.fillStyle='#ffcf3f';
    ctx.fillText(ordinal(p.place),22,46);
    ctx.font='14px system-ui'; ctx.fillStyle='#aab6c8'; ctx.textAlign='right';
    ctx.fillText(`${this.cars.length} cars`,168,54);
    ctx.textAlign='left';

    // top-right: timer + best lap
    ctx.textAlign='right';
    panel(VW-180,10,170,64);
    ctx.fillStyle='#e8eef7'; ctx.font='bold 24px monospace';
    ctx.fillText(fmtTime(this.raceTime),VW-22,18);
    const key=this.track.def.name;
    const bl=this.best[key]?this.best[key].lap:null;
    ctx.font='12px system-ui'; ctx.fillStyle='#8ab9d0';
    ctx.fillText(bl?`best lap ${fmtTime(bl)}`:'best lap —',VW-22,48);
    ctx.textAlign='left';

    // speedometer bottom-right
    if(this.showTouch) this.drawSpeedo(VW-60,138,44,p);
    else this.drawSpeedo(VW-96,VH-96,72,p);

    // speed lines while boosting
    if(p.boost>0 && p.speed>200) this.drawSpeedLines(p);

    // nitro meter
    this.drawNitro(p);

    // minimap
    this.drawMinimap();

    // drift score / combo
    this.drawDriftScore();

    // lap completion popup with delta
    if(this.lapPopup && this.state===STATE.RACE){
      const lp=this.lapPopup, a=clamp(lp.timer/2.6,0,1);
      const rise=(1-a)*18;
      ctx.textAlign='center'; ctx.globalAlpha=clamp(a*2,0,1);
      ctx.font='bold 24px system-ui'; ctx.fillStyle='#e8eef7';
      ctx.fillText(`LAP ${lp.lap}`,VW/2,VH*0.2-rise);
      if(lp.delta!==null){
        const faster=lp.delta<0;
        ctx.font='bold 20px system-ui'; ctx.fillStyle=faster?'#5ef08a':'#ff5d6c';
        const s=(faster?'-':'+')+fmtTime(Math.abs(lp.delta));
        ctx.fillText(s,VW/2,VH*0.2+24-rise);
      }
      ctx.globalAlpha=1; ctx.textAlign='left';
    }

    // wrong-way warning
    if(this.player.wrongTimer>0.5 && this.state===STATE.RACE){
      ctx.textAlign='center';
      const blink=0.5+0.5*Math.sin(this.time*12);
      ctx.globalAlpha=blink;
      ctx.fillStyle='#ff5d6c'; ctx.font='bold 30px system-ui';
      ctx.fillText('⚠ WRONG WAY',VW/2,VH*0.34);
      ctx.globalAlpha=1; ctx.textAlign='left';
    }

    // countdown overlay
    if(this.state===STATE.COUNTDOWN){
      const c=Math.ceil(this.countdown);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,VW,VH);
      // F1 start lights
      const lit=this.countdown>0 ? clamp(Math.ceil(5*(1-this.countdown/4)),0,5) : 0;
      const go=this.countdown<=0;
      const n=5, gap=14, r=17, totalW=n*(r*2)+(n-1)*gap;
      const lx=VW/2-totalW/2+r, ly=VH*0.32;
      ctx.fillStyle='rgba(15,18,26,0.9)';
      roundRect(ctx,lx-r-16,ly-r-12,totalW+32,r*2+24,10); ctx.fill();
      for(let i=0;i<n;i++){
        const x=lx+i*(r*2+gap);
        ctx.beginPath(); ctx.arc(x,ly,r,0,TAU);
        if(go){ ctx.fillStyle='#28331f'; }
        else ctx.fillStyle = i<lit ? '#ff2b3a' : '#331016';
        ctx.fill();
        if(!go && i<lit){ ctx.fillStyle='rgba(255,120,120,0.5)'; ctx.beginPath(); ctx.arc(x-r*0.3,ly-r*0.3,r*0.4,0,TAU); ctx.fill(); }
        if(go){ ctx.fillStyle='#5ef08a'; ctx.beginPath(); ctx.arc(x,ly,r,0,TAU); ctx.fill();
          ctx.fillStyle='rgba(200,255,210,0.6)'; ctx.beginPath(); ctx.arc(x-r*0.3,ly-r*0.3,r*0.4,0,TAU); ctx.fill(); }
      }
      ctx.font='bold 110px system-ui';
      ctx.fillStyle = c>0?'#ffcf3f':'#5ef08a';
      const scale=1+(1-(this.countdown%1))*0.9;
      ctx.save(); ctx.translate(VW/2,VH*0.56); ctx.scale(scale,scale);
      ctx.fillText(c>0?c:'GO!',0,0); ctx.restore();
      ctx.textAlign='left'; ctx.textBaseline='top';
    }

    if(this.showTouch && (this.state===STATE.RACE||this.state===STATE.COUNTDOWN)) this.drawTouchControls();

    if(this.state===STATE.PAUSE) this.drawPause();
    if(this.state===STATE.RESULTS) this.drawResults();
  }
  drawTouchControls(){
    for(const b of this._touchButtons()){
      const active=this.touch[b.id];
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU);
      ctx.fillStyle=active?'rgba(255,255,255,0.28)':'rgba(20,26,36,0.42)';
      ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle=b.color?b.color:'rgba(255,255,255,0.5)';
      ctx.globalAlpha=active?1:0.7; ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle=b.color||'#e8eef7';
      ctx.font=`${Math.round(b.r*0.9)}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.label,b.x,b.y+1);
    }
    // pause button
    const pb=this._pauseBtn();
    ctx.beginPath(); ctx.arc(pb.x,pb.y,pb.r,0,TAU);
    ctx.fillStyle='rgba(20,26,36,0.5)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#e8eef7'; ctx.fillRect(pb.x-6,pb.y-7,4,14); ctx.fillRect(pb.x+2,pb.y-7,4,14);
    ctx.textAlign='left'; ctx.textBaseline='top';
  }

  drawSpeedLines(p){
    const cx=VW/2, cy=VH/2;
    const strength=clamp((p.speed-190)/280,0,1);
    ctx.save();
    ctx.lineCap='round';
    const nitro=p.wantNitro && (p.nitro||0)>0;
    const col=nitro?'255,180,90':'190,230,255';
    ctx.strokeStyle=`rgba(${col},0.5)`;
    ctx.lineWidth=3;
    const count=22;
    const R=Math.hypot(VW,VH)/2;
    for(let i=0;i<count;i++){
      const a=(i/count)*TAU + Math.sin(this.time*3+i)*0.04;
      const r0=Math.min(VW,VH)*0.40;
      const jitter=(Math.sin(this.time*22+i*7)*0.5+0.5);
      const r1=r0 + 50 + (i%3)*28 + jitter*40;
      ctx.globalAlpha=(0.2+0.5*strength)*jitter;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*Math.min(r1,R), cy+Math.sin(a)*Math.min(r1,R));
      ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  drawNitro(p){
    const n=p.nitro||0;
    const bw=200, bh=13;
    const bx=VW/2-bw/2, by=this.showTouch?62:VH-30;
    ctx.fillStyle='rgba(10,14,20,0.6)'; roundRect(ctx,bx-3,by-3,bw+6,bh+6,5); ctx.fill();
    const ready=n>0.02;
    const deploying=p.wantNitro && ready;
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    if(deploying){ g.addColorStop(0,'#ffcf3f'); g.addColorStop(1,'#ff7a1a'); }
    else { g.addColorStop(0,'#39d0ff'); g.addColorStop(1,'#5ef0e0'); }
    ctx.fillStyle=g;
    roundRect(ctx,bx,by,bw*n,bh,4); ctx.fill();
    ctx.strokeStyle=ready?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.2)'; ctx.lineWidth=1;
    roundRect(ctx,bx,by,bw,bh,4); ctx.stroke();
    if(!this.showTouch){
      ctx.textAlign='center'; ctx.font='bold 10px system-ui';
      ctx.fillStyle=ready?'#ffffff':'#6a7a8c';
      ctx.fillText('NITRO  (SHIFT)',VW/2,by-13);
      ctx.textAlign='left';
    }
  }

  drawDriftScore(){
    const p=this.player;
    ctx.textAlign='center';
    // running total (always visible, small)
    if(p.driftScore>0 || p.chain>0){
      ctx.font='12px system-ui'; ctx.fillStyle='#8ab9d0';
      ctx.fillText('DRIFT SCORE',VW/2,84);
      ctx.font='bold 22px system-ui'; ctx.fillStyle='#e8eef7';
      ctx.fillText((p.driftScore+Math.round(p.chain)).toLocaleString(),VW/2,98);
    }
    // active chain
    if(p.chainFade>0 && p.chain>0){
      const a=p.chainFade;
      const scale=1+ (p.mult-1)*0.06;
      ctx.save(); ctx.translate(VW/2,150); ctx.scale(scale,scale);
      ctx.globalAlpha=a;
      ctx.font='bold 34px system-ui'; ctx.fillStyle='#ffcf3f';
      ctx.fillText(`+${Math.round(p.chain)}`,0,0);
      ctx.font='bold 20px system-ui'; ctx.fillStyle='#39d0ff';
      ctx.fillText(`x${p.mult.toFixed(1)}`,0,26);
      ctx.restore(); ctx.globalAlpha=1;
    }
    // bank flash
    if(p.bankFlash>0){
      ctx.globalAlpha=clamp(p.bankFlash,0,1);
      ctx.font='bold 26px system-ui'; ctx.fillStyle='#5ef08a';
      ctx.fillText(`+${p.lastBank}  BANKED`,VW/2,150);
      ctx.globalAlpha=1;
    }
    ctx.textAlign='left';
  }

  drawSpeedo(cx,cy,r,p){
    const kmh=Math.round(p.speed/2.2);
    ctx.save(); ctx.translate(cx,cy);
    ctx.fillStyle='rgba(10,14,20,0.72)'; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2; ctx.stroke();
    // arc gauge
    const a0=Math.PI*0.75, a1=Math.PI*2.25;
    const frac=clamp(p.speed/430,0,1);
    ctx.lineWidth=6; ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(0,0,r-10,a0,a1); ctx.stroke();
    ctx.strokeStyle= p.boost>0?'#39d0ff': (frac>0.8?'#ff5d6c':'#5ef08a');
    ctx.beginPath(); ctx.arc(0,0,r-10,a0,a0+(a1-a0)*frac); ctx.stroke();
    ctx.fillStyle='#e8eef7'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 26px system-ui'; ctx.fillText(kmh,0,-2);
    ctx.font='10px system-ui'; ctx.fillStyle='#8ab9d0'; ctx.fillText('KM/H',0,18);
    ctx.restore();
    ctx.textAlign='left'; ctx.textBaseline='top';
  }

  drawMinimap(){
    const t=this.track;
    const touch=this.showTouch;
    const mw=touch?96:150, mh=touch?96:150;
    const mx=12, my=touch?104:VH-mh-12;
    // compute bounds
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    for(const c of t.center){ minx=Math.min(minx,c.x);miny=Math.min(miny,c.y);maxx=Math.max(maxx,c.x);maxy=Math.max(maxy,c.y);}
    const pad=40; minx-=pad;miny-=pad;maxx+=pad;maxy+=pad;
    const sc=Math.min(mw/(maxx-minx),mh/(maxy-miny));
    const toX=x=>mx+(x-minx)*sc, toY=y=>my+(y-miny)*sc;
    ctx.fillStyle='rgba(10,14,20,0.6)'; roundRect(ctx,mx-6,my-6,mw+12,mh+12,8); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=4; ctx.beginPath();
    for(let i=0;i<=t.n;i++){ const c=t.center[i%t.n]; const x=toX(c.x),y=toY(c.y); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke();
    for(const c of this.cars){
      ctx.fillStyle=c.isPlayer?'#fff':c.color;
      ctx.beginPath(); ctx.arc(toX(c.x),toY(c.y),c.isPlayer?4:3,0,TAU); ctx.fill();
    }
  }

  drawMenu(){
    const th=THEME[TRACKS[this.trackIdx].theme];
    // animated background
    ctx.fillStyle='#070b12'; ctx.fillRect(0,0,VW,VH);
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.translate(VW/2,VH/2+40);
    ctx.scale(0.34,0.34);
    const t=this.track; const W=t.width/2;
    let cx=0,cy=0; for(const c of t.center){cx+=c.x;cy+=c.y;} cx/=t.n;cy/=t.n;
    ctx.translate(-cx,-cy);
    ctx.strokeStyle=th.road; ctx.lineWidth=t.width; ctx.lineJoin='round';
    ctx.beginPath(); for(let i=0;i<=t.n;i++){const c=t.center[i%t.n]; if(i===0)ctx.moveTo(c.x,c.y);else ctx.lineTo(c.x,c.y);} ctx.stroke();
    ctx.strokeStyle=th.line; ctx.lineWidth=3; ctx.setLineDash([16,20]);
    ctx.beginPath(); for(let i=0;i<=t.n;i++){const c=t.center[i%t.n]; if(i===0)ctx.moveTo(c.x,c.y);else ctx.lineTo(c.x,c.y);} ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();

    ctx.textAlign='center';
    ctx.textBaseline='alphabetic';
    ctx.fillStyle='#ffcf3f'; ctx.font='bold 68px system-ui';
    ctx.fillText('APEX DRIFT',VW/2,VH*0.18);
    ctx.fillStyle='#8ab9d0'; ctx.font='16px system-ui';
    ctx.fillText('top-down drift racing',VW/2,VH*0.18+28);
    ctx.textBaseline='top';

    const rec=this.best[TRACKS[this.trackIdx].name];
    const items=[
      {label:'Track', value:TRACKS[this.trackIdx].name, dec:()=>{this.trackIdx=(this.trackIdx+TRACKS.length-1)%TRACKS.length; this.setupTrack();}, inc:()=>{this.trackIdx=(this.trackIdx+1)%TRACKS.length; this.setupTrack();}},
      {label:'Laps', value:this.totalLaps, dec:()=>{this.totalLaps=clamp(this.totalLaps-1,1,9);}, inc:()=>{this.totalLaps=clamp(this.totalLaps+1,1,9);}},
      {label:'Opponents', value:this.aiCount, dec:()=>{this.aiCount=clamp(this.aiCount-1,0,5);}, inc:()=>{this.aiCount=clamp(this.aiCount+1,0,5);}},
    ];
    const baseY=VH*0.42;
    items.forEach((it,i)=>{
      const y=baseY+i*48; const sel=i===this.menuSel;
      ctx.textAlign='center';
      ctx.fillStyle=sel?'#ffcf3f':'#c7d2e0'; ctx.font=`${sel?'bold ':''}23px system-ui`;
      ctx.fillText(`${it.label}:  ${it.value}`,VW/2,y);
      // clickable arrows
      const ah=34;
      this.uiButton(VW/2-190,y-ah/2,ah,ah,'‹',()=>{this.menuSel=i; it.dec(); audio.blip(360,0.05);},{font:'bold 24px system-ui',fill:'rgba(255,255,255,0.05)'});
      this.uiButton(VW/2+156,y-ah/2,ah,ah,'›',()=>{this.menuSel=i; it.inc(); audio.blip(360,0.05);},{font:'bold 24px system-ui',fill:'rgba(255,255,255,0.05)'});
    });
    // best record for selected track
    if(rec){
      ctx.textAlign='center'; ctx.font='13px system-ui'; ctx.fillStyle='#8ab9d0';
      const parts=[]; if(rec.lap) parts.push(`best lap ${fmtTime(rec.lap)}`); if(rec.drift) parts.push(`drift ${rec.drift.toLocaleString()}`);
      if(parts.length) ctx.fillText(parts.join('   ·   '),VW/2,baseY+3*48+2);
    }
    // Race button
    this.uiButton(VW/2-120,baseY+3*48+18,240,52,'▶  RACE',()=>{this.startRace();},{color:'#5ef08a',fill:'rgba(94,240,138,0.12)',stroke:'rgba(94,240,138,0.5)',font:'bold 24px system-ui'});
    ctx.fillStyle='#6a7a8c'; ctx.font='13px system-ui'; ctx.textAlign='center';
    const hint=this.showTouch
      ? 'tap ‹ › to change · pads to drive · ✋ handbrake · 🔥 nitro'
      : '↑↓ select · ←→ change · WASD/Arrows drive · SPACE handbrake · SHIFT nitro · P pause · M mute';
    ctx.fillText(hint,VW/2,VH-28);
    ctx.textAlign='left';
  }

  drawPause(){
    ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';
    ctx.fillStyle='#ffcf3f'; ctx.font='bold 52px system-ui'; ctx.fillText('PAUSED',VW/2,VH*0.32);
    ctx.textAlign='left';
    const bw=220, bx=VW/2-bw/2; let by=VH*0.42;
    this.uiButton(bx,by,bw,46,'▶  Resume',()=>{this.state=STATE.RACE;},{color:'#5ef08a'}); by+=58;
    this.uiButton(bx,by,bw,46,'↻  Restart',()=>{this.startRace();}); by+=58;
    this.uiButton(bx,by,bw,46,'⤶  Main Menu',()=>{this.state=STATE.MENU;}); by+=58;
    this.uiButton(bx,by,bw,40,(this.muted?'🔇':'🔊')+'  Sound',()=>{this.toggleMute();},{font:'16px system-ui',color:'#8ab9d0'});
  }

  drawResults(){
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';
    ctx.fillStyle='#ffcf3f'; ctx.font='bold 52px system-ui';
    const won=this.player.place===1;
    ctx.fillText(won?'🏆  YOU WIN!':`Finished ${ordinal(this.player.place)}`,VW/2,VH*0.2);
    const order=[...this.cars].sort((a,b)=>a.place-b.place);
    ctx.font='20px system-ui';
    order.forEach((c,i)=>{
      const y=VH*0.32+i*34;
      ctx.fillStyle=c.isPlayer?'#5ef08a':'#c7d2e0';
      const tt=c.finished?fmtTime(c.finishTime):'DNF';
      ctx.fillText(`${ordinal(i+1)}   ${c.isPlayer?'YOU':'CPU'}   ${tt}`,VW/2,y);
    });
    const bl=Math.min(...this.player.lapTimes.filter(x=>x>0));
    let ry=VH*0.32+order.length*34+20;
    if(isFinite(bl)){ ctx.fillStyle='#8ab9d0'; ctx.font='16px system-ui'; ctx.fillText(`best lap ${fmtTime(bl)}`,VW/2,ry); ry+=24; }
    const ds=(this.player.driftScore||0)+Math.round(this.player.chain||0);
    if(ds>0){ ctx.fillStyle='#ffcf3f'; ctx.font='bold 18px system-ui'; ctx.fillText(`drift score  ${ds.toLocaleString()}`,VW/2,ry); }
    ctx.textAlign='left';
    const bw=200, gap=16, total=bw*2+gap, bx=VW/2-total/2, by=VH*0.84;
    this.uiButton(bx,by,bw,48,'↻  Race Again',()=>{this.startRace();},{color:'#5ef08a'});
    this.uiButton(bx+bw+gap,by,bw,48,'⤶  Main Menu',()=>{this.state=STATE.MENU;});
  }
}

/* helpers for HUD */
function panel(x,y,w,h){
  ctx.fillStyle='rgba(10,14,20,0.62)';
  roundRect(ctx,x,y,w,h,8); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.stroke();
}
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fmtTime(t){ const m=Math.floor(t/60), s=Math.floor(t%60), ms=Math.floor((t*1000)%1000); return `${m}:${s.toString().padStart(2,'0')}.${ms.toString().padStart(3,'0')}`; }
function nearIndex(i,target,n,tol){ let d=Math.abs(i-target); d=Math.min(d,n-d); return d<=tol; }

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
const game=new Game();
window.game=game;   // exposed for debugging / tinkering in the console
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,1/30); // clamp big pauses
  game.update(dt);
  game.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
